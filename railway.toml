# Root Railway service — now runs Cadence (NiceGUI), not the old Flask app.
# Cadence reads the same Supabase data, so no migration; it just took over the URL.
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
dockerContext = "."

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
