name: CI — Cadence sanity check

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r cadence/requirements.txt

      - name: Compile check
        run: python -m compileall -q cadence

      - name: Import check
        env:
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_ANON_KEY: "placeholder"
        run: |
          python - <<'EOF'
          import cadence.main            # registers pages, wires the app
          import cadence.money, cadence.store, cadence.data, cadence.forecast, cadence.formulas
          from cadence.store import Store
          s = Store()                    # demo engine boots + money invariant path
          m = s.metrics()
          rows = s._all_rows()
          resid = round(m["cash"] - (m["unallocated"] + sum(r["funded"] - r["spent"] for r in rows)), 2)
          assert abs(resid) < 0.005, f"money invariant drift: {resid}"
          print("Cadence imports OK · invariant holds")
          EOF
